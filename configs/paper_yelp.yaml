experiment:
  name: paper_yelp
  seed: 42
  device: auto
  deterministic: true

data:
  directory: data/yelp/monthly
  strict_paper_schema: true
  train: {start: 2016-01, end: 2018-12}
  validation: {start: 2019-01, end: 2019-12}
  test: {start: 2020-01, end: 2020-12}

model:
  hidden_dim: 64
  attention_heads: 4
  dropout: 0.2
  antibody_hidden_dim: 32
  fairness_gamma: 0.9
  use_antibody_injection: true
  use_fairness_memory: true
  use_social_aggregation: true

candidates:
  enabled: true
  top_k: 32
  preference_weight: 1.0
  distance_weight: 1.0
  fairness_weight: 1.0
  slack_weight: 0.1

loss:
  lambda_p: 0.7
  utility_weight: 1.0
  cost_weight: 1.0
  fairness_weight: 1.0
  normalize_utility: true
  normalize_cost: true
  reduction: mean

assignment:
  threshold_base: 0.4
  threshold_scale: 0.1
  force_assign: true

training:
  epochs: 500
  learning_rate: 0.01
  weight_decay: 0.0
  gradient_clip_norm: 5.0
  scheduler_patience: 10
  scheduler_factor: 0.5
  minimum_learning_rate: 0.00001
  output_directory: outputs/paper_yelp

evaluation:
  cost_unit_km: 100.0
  dense_auc_pair_limit: 5000000
